requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "ultralytics>=8.3",
    "numpy>=1.26,<2",
    "imageio",
    "perspective2d",
    "sam3",
    "setuptools>=84.0.0",
    "einops>=0.8.2",
    "pycocotools>=2.0.11",
